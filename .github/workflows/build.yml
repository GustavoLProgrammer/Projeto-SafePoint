name: construir
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar google-services.json CORRIGIDO
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_JSON" > app/google-services.json
          echo "Antes:"
          cat app/google-services.json | grep package_name || true
          # Corrige automaticamente o package_name para com.safepoint.app
          sed -i 's/"package_name": *".*"/"package_name": "com.safepoint.app"/g' app/google-services.json
          echo "Depois:"
          cat app/google-services.json | grep package_name || true

      - name: Compilar o APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: SafePoint-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
